<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="180" height="180" class="logo-loader">
  <defs>
    <!-- Gradient chuyển động quét sáng (Shimmer) -->
    <linearGradient id="shimmer-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E8BE96" stop-opacity="0.6"/>
      <stop offset="50%" stop-color="#FFF2E2" stop-opacity="1"/>
      <stop offset="100%" stop-color="#E8BE96" stop-opacity="0.6"/>
      <animate attributeName="x1" from="-100%" to="200%" dur="2.2s" repeatCount="indefinite" />
      <animate attributeName="x2" from="0%" to="300%" dur="2.2s" repeatCount="indefinite" />
    </linearGradient>

    <!-- Style keyframes -->
    <style>
      .logo-loader {
        overflow: visible;
        filter: drop-shadow(0 4px 12px rgba(232, 190, 150, 0.25));
      }

      .pulse-group {
        transform-origin: center;
        animation: organicPulse 3s ease-in-out infinite;
      }

      .foliage-layer {
        fill: url(#shimmer-grad);
      }

      .floating-leaf {
        animation: floatShift 2.5s ease-in-out infinite alternate;
      }

      .floating-leaf-reverse {
        animation: floatShiftRev 2.8s ease-in-out infinite alternate;
      }

      @keyframes organicPulse {
        0%, 100% {
          transform: scale(1);
          opacity: 0.92;
        }
        50% {
          transform: scale(1.025);
          opacity: 1;
        }
      }

      @keyframes floatShift {
        0% { transform: translateX(0px); }
        100% { transform: translateX(3px); }
      }

      @keyframes floatShiftRev {
        0% { transform: translateX(0px); }
        100% { transform: translateX(-3px); }
      }
    </style>
  </defs>

  <g class="pulse-group">
    <!-- Khung viền hình học -->
    <path class="foliage-layer" fill-rule="evenodd" d="
      M 95 45 H 205 V 65 H 115 V 405 H 215 V 455 H 95 Z 
      M 305 45 H 415 V 275 H 395 V 65 H 305 Z 
      M 395 385 H 415 V 455 H 285 V 405 H 395 Z" />

    <!-- Thân và cành chính (Cedar Trunk) -->

      M 245 455 V 360 C 200 360 110 375 60 365 C 50 363 50 348 65 348 C 120 348 210 342 245 320 
      C 210 300 135 305 125 295 C 120 290 125 282 140 282 C 185 282 230 268 245 250 
      C 230 238 180 240 170 230 C 165 224 172 218 185 218 C 215 218 240 208 245 190
      C 235 178 205 178 200 170 C 197 165 204 158 215 158 C 235 158 248 145 248 120
      C 240 115 220 118 215 105 C 215 95 230 92 242 85 C 230 75 230 45 250 30 
      C 270 45 270 75 258 85 C 270 92 285 95 285 105 C 280 118 260 115 252 120
      C 252 145 265 158 285 158 C 296 158 303 165 300 170 C 295 178 265 178 255 190
      C 260 208 285 218 315 218 C 328 218 335 224 330 230 C 320 240 270 238 255 250
      C 270 268 315 282 360 282 C 375 282 380 290 375 295 C 365 305 290 300 255 320
      C 290 342 380 348 435 348 C 450 348 450 363 440 365 C 390 375 300 360 255 360
      V 455 Z" />

    <!-- Các tầng tán lá lượn sóng nổi (Organic Layers) -->
    <!-- Tầng trên -->
    <path class="foliage-layer floating-leaf" d="M 210 135 Q 250 125 290 135 Q 250 145 210 135 Z" />
    <path class="foliage-layer floating-leaf-reverse" d="M 195 172 Q 250 162 305 172 Q 250 182 195 172 Z" />
    
    <!-- Tầng giữa -->
    <path class="foliage-layer floating-leaf" d="M 170 205 Q 220 195 240 205 Q 220 215 170 205 Z" />

    <path class="foliage-layer floating-leaf-reverse" d="M 275 242 Q 330 230 365 245 Q 310 258 275 242 Z" />

    <!-- Tầng dưới & cụm lá lơ lửng -->
    <path class="foliage-layer floating-leaf" d="M 130 282 Q 190 270 215 285 Q 170 295 130 282 Z" />
    <path class="foliage-layer floating-leaf-reverse" d="M 335 285 Q 395 272 415 290 Q 370 300 335 285 Z" />

    <!-- Đốm lá chân gốc -->

  </g>
</svg>
